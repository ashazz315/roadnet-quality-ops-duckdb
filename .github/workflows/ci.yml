name: CI

on:
  push:
    branches: [main, roadinsight-v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall app.py roadinsight_app.py roadinsight_ui src quality_mvp tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/ui_model.test.cjs
      - run: python scripts/09_validate.py --output data/runtime/ci_validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: |
            data/runtime/ci_validation/suite.json
            data/runtime/ci_validation/failure.json
            data/runtime/ci_validation/*.log
            data/runtime/ci_validation/run*/evaluation.json
